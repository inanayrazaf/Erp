<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const BIZ=[['epicerie','🛒 Épicerie'],['ppn','📦 Grossiste PPN'],['friperie','👗 Friperie'],['tilapia','🐟 Tilapia'],['btp','🏗️ BTP']];
const MODS=[['caisse','💰 Caisse / trésorerie'],['clients','👥 Clients'],['ventes','🛒 Ventes'],['facturation','🧾 Facturation'],['stock','📦 Stocks'],['achats','🚚 Achats / fournisseurs'],['compta','📚 Comptabilité']];
const dbName='veloce_erp_mada_v6_1'; let db, key=null, state=null, activeBiz='epicerie', activeMod='caisse';
const SUPABASE_URL='https://vxcfgzowcgkgpbuofznr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_iUbIE38vp-TLLYB9CmD6Xg_bCLtt47W';
const supabaseClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let cloudSession=null, cloudCompanyId=null, cloudBusy=false;
const $=id=>document.getElementById(id); const money=n=>new Intl.NumberFormat('fr-FR').format(Math.round(Number(n)||0))+' Ar';
function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
async function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))}
function hex(a){return [...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function derive(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits','deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(obj,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {iv:[...iv],ct:[...new Uint8Array(ct)]}}
async function dec(rec,k){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(rec.iv)},k,new Uint8Array(rec.ct));return JSON.parse(new TextDecoder().decode(pt))}
function baseState(){const businesses={};for(const [id,name] of BIZ)businesses[id]={name,customers:[],suppliers:[],products:[],sales:[],invoices:[],quotes:[],orders:[],deliveries:[],purchases:[],cash:{sessions:[],transactions:[],transfers:[]},stockMovements:[],returns:[],inventory:[],creditPayments:[],locations:[{id:'main',name:'Principal'}],batches:[] ,special:{}};return {version:610,company:{name:'Mon entreprise',nif:'',stat:'',rcs:'',address:'',phone:'',email:'',logo:''},businesses,employees:[],settings:{invoicePrefix:'FAC',invoiceNext:1,currency:'Ar',taxRate:20,signature:'',invoiceModel:'standard'},createdAt:Date.now()}}
async function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
async function getMeta(id){return new Promise((res,rej)=>{const t=db.transaction('meta','readonly').objectStore('meta').get(id);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function putMeta(v){return new Promise((res,rej)=>{const t=db.transaction('meta','readwrite').objectStore('meta').put(v);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
function cloudEmail(identifier){const raw=String(identifier||'').trim().toLowerCase();if(raw.includes('@'))return raw;return raw.replace(/[^a-z0-9._-]/g,'-')+'@veloce.local'}
async function cloudAuth(identifier,password){if(!supabaseClient)return null;const email=cloudEmail(identifier);let r=await supabaseClient.auth.signInWithPassword({email,password});if(!r.error&&r.data?.session)return r.data.session;const sign=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:identifier}}});if(sign.data?.session)return sign.data.session;return null}
async function cloudBootstrap(allowPull=false){if(!supabaseClient||!cloudSession)return;try{const rpc=await supabaseClient.rpc('ensure_my_company',{p_name:state.company.name});if(rpc.error)throw rpc.error;cloudCompanyId=rpc.data;const snap=await supabaseClient.from('erp_snapshots').select('state,version,updated_at').eq('company_id',cloudCompanyId).maybeSingle();if(snap.error)throw snap.error;if(allowPull && snap.data?.state){state=snap.data.state;normalizeState();await persistLocalOnly()}setCloudStatus(true)}catch(err){console.warn('Cloud bootstrap',err);setCloudStatus(false)}}
async function syncCloud(){if(!supabaseClient||!cloudSession||!cloudCompanyId||cloudBusy)return;cloudBusy=true;try{const r=await supabaseClient.from('erp_snapshots').upsert({company_id:cloudCompanyId,user_id:cloudSession.user.id,state,version:Number(state.version||68),updated_at:new Date().toISOString()},{onConflict:'company_id'});if(r.error)throw r.error;setCloudStatus(true)}catch(err){console.warn('Cloud sync',err);setCloudStatus(false)}finally{cloudBusy=false}}
function setCloudStatus(ok){const b=$('cloudBtn');if(!b)return;b.textContent=ok?'☁️✓':'☁️';b.title=ok?'Synchronisé avec Supabase':'Mode local — synchronisation indisponible'}
async function persistLocalOnly(){const meta=await getMeta('auth');await putMeta({...meta,blob:await enc(state,key)})}
async function setupAuth(){await idbOpen();const meta=await getMeta('auth');const saved=localStorage.getItem('veloce_user');if(saved)$('loginUser').value=saved;if(meta)$('authMsg').textContent='Compte déjà configuré sur cet appareil. Connectez-vous pour déverrouiller vos données.';if(supabaseClient){const s=await supabaseClient.auth.getSession();cloudSession=s.data?.session||null;if(cloudSession){try{const p=await supabaseClient.from('profiles').select('company_id').eq('id',cloudSession.user.id).maybeSingle();cloudCompanyId=p.data?.company_id||null;if(!cloudCompanyId && state){await cloudBootstrap(false)}}catch(e){console.warn('Cloud session bootstrap',e)}}}}
async function login(e){e.preventDefault();const u=$('loginUser').value.trim(),p=$('loginPass').value;if(p.length<6)return;$('authMsg').textContent='Déverrouillage…';const meta=await getMeta('auth');const isNewLocal=!meta;try{if(!meta){const salt=crypto.getRandomValues(new Uint8Array(16));const k=await derive(p,salt);const verifier=hex(await sha(u+'|'+p+'|'+hex(salt)));state=baseState();normalizeState();await putMeta({id:'auth',u,salt:[...salt],verifier,blob:await enc(state,k)});key=k}else{if(u!==meta.u||hex(await sha(u+'|'+p+'|'+hex(new Uint8Array(meta.salt))))!==meta.verifier)throw Error('Identifiant ou mot de passe incorrect.');key=await derive(p,new Uint8Array(meta.salt));state=await dec(meta.blob,key);normalizeState()}if($('rememberUser').checked)localStorage.setItem('veloce_user',u);else localStorage.removeItem('veloce_user');if(supabaseClient){cloudSession=await cloudAuth(u,p);if(cloudSession){await cloudBootstrap(isNewLocal);if(cloudCompanyId)await syncCloud();else setCloudStatus(false)}else setCloudStatus(false)}$('authView').classList.add('hidden');$('appView').classList.remove('hidden');render();toast(cloudSession?'Session déverrouillée • synchronisation cloud active':'Session déverrouillée • mode local')}catch(err){$('authMsg').textContent=err.message||'Impossible de se connecter';}}
async function persist(){await persistLocalOnly();syncCloud().catch(()=>{});}

function inviteUserForm(){showModal(`<h2>✉️ Inviter un utilisateur</h2><form onsubmit="sendUserInvite(event)"><div class="form-grid"><div class="field"><label>Nom complet</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Rôle</label><select name="role_code">${Object.entries(ROLE_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><button>Envoyer l’invitation</button><button type="button" class="secondary" onclick="usersView()">Annuler</button></form>`)}
async function sendUserInvite(e){e.preventDefault();if(!cloudSession)return toast('Session Supabase inactive.');const f=new FormData(e.target);const r=await supabaseClient.functions.invoke('admin-invite-user',{body:{email:f.get('email'),full_name:f.get('full_name'),role_code:f.get('role_code')}});if(r.error||r.data?.error){await auditLog('administration','invite_user',null,{email:f.get('email'),role:f.get('role_code')});return toast('Invitation impossible : '+(r.data?.error||r.error.message))}await auditLog('administration','invite_user',r.data?.user_id,{email:f.get('email'),role:f.get('role_code')});closeModal();toast('Invitation envoyée à '+f.get('email'));}
async function editUserAccess(profileId){
  const [{data:u},{data:roleRow},{data:perms}]=await Promise.all([
    supabaseClient.from('profiles').select('id,full_name').eq('id',profileId).maybeSingle(),
    supabaseClient.from('user_roles').select('role_code').eq('profile_id',profileId).eq('company_id',cloudCompanyId).maybeSingle(),
    supabaseClient.from('user_permissions').select('permission_code,allowed').eq('profile_id',profileId).eq('company_id',cloudCompanyId)
  ]);
  const pm=Object.fromEntries((perms||[]).map(x=>[x.permission_code,x.allowed]));
  const checks=Object.entries(PERM_LABELS).map(([k,v])=>`<label class="choice"><input type="checkbox" name="perm" value="${k}" ${pm[k]?'checked':''}>${v}</label>`).join('');
  const bizChecks=BIZ.map(([id,n])=>`<label class="choice"><input type="checkbox" name="bizperm" value="${id}" ${pm['biz:'+id]?'checked':''}>${n}</label>`).join('');
  showModal(`<h2>⚙️ ${esc(u?.full_name||'Utilisateur')}</h2><form onsubmit="saveUserAccess(event,'${profileId}')"><div class="field"><label>Rôle</label><select name="role_code">${Object.entries(ROLE_LABELS).map(([k,v])=>`<option value="${k}" ${(roleRow?.role_code||'cashier')===k?'selected':''}>${v}</option>`).join('')}</select></div><h3>Permissions</h3><div class="choice-grid">${checks}</div><h3>Business autorisés</h3><div class="choice-grid">${bizChecks}</div><button>Enregistrer les droits</button><button type="button" class="secondary" onclick="usersView()">Annuler</button></form>`);
}
async function saveUserAccess(e,profileId){e.preventDefault();const f=new FormData(e.target);const roleCode=f.get('role_code');await supabaseClient.from('user_roles').upsert({profile_id:profileId,company_id:cloudCompanyId,role_code:roleCode},{onConflict:'profile_id,company_id'});const wanted=new Set(f.getAll('perm').map(String).concat(f.getAll('bizperm').map(x=>'biz:'+x)));const all=Object.keys(PERM_LABELS).concat(BIZ.map(([id])=>'biz:'+id));for(const code of all){await supabaseClient.from('user_permissions').upsert({profile_id:profileId,company_id:cloudCompanyId,permission_code:code,allowed:wanted.has(code)},{onConflict:'profile_id,company_id,permission_code'});}await auditLog('administration','update_user_access',profileId,{role:roleCode,permissions:[...wanted]});closeModal();toast('Droits utilisateur enregistrés');}
async function auditLog(business,action,entityId,newData){if(!supabaseClient||!cloudSession||!cloudCompanyId)return;await supabaseClient.from('audit_logs').insert({company_id:cloudCompanyId,user_id:cloudSession.user.id,business,action,entity_type:'user_admin',entity_id:entityId?String(entityId):null,new_data:newData||{}})}
async function auditView(){if(!cloudSession||!cloudCompanyId)return toast('Supabase non connecté.');const role=await currentRole();if(role!=='admin')return toast('Accès administrateur requis.');const {data,error}=await supabaseClient.from('audit_logs').select('id,user_id,business,action,entity_type,entity_id,new_data,created_at').eq('company_id',cloudCompanyId).order('created_at',{ascending:false}).limit(100);if(error)return toast('Impossible de charger le journal.');showModal(`<h2>🧾 Journal d’audit</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Utilisateur</th><th>Business</th><th>Action</th><th>Données</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('fr-FR')}</td><td>${esc(x.user_id||'')}</td><td>${esc(x.business||'')}</td><td>${esc(x.action)}</td><td><code>${esc(JSON.stringify(x.new_data||{}))}</code></td></tr>`).join('')}</tbody></table></div><button class="secondary" onclick="usersView()">Retour</button>`)}

function renderModules(){$('moduleStrip').innerHTML=activeBiz==='btp'?'':MODS.map(([id,n])=>`<button class="${id===activeMod?'active':''}" onclick="selectMod('${id}')">${n}</button>`).join('')}
function selectBiz(id){activeBiz=id;activeMod='caisse';render()};function selectMod(id){activeMod=id;renderContent()}
function biz(){return state.businesses[activeBiz]}
function renderContent(){const b=biz();$('headBusiness').textContent=state.company.name+' • '+b.name;if(activeBiz==='btp'){$('content').innerHTML=viewBtp(b);return}const views={caisse:viewCaisse,clients:viewClients,ventes:viewVentes,facturation:viewFacturation,stock:viewStock,achats:viewAchats,compta:viewCompta};$('content').innerHTML=views[activeMod](b);}
function btpData(b){if(!b.special)b.special={};if(!Array.isArray(b.special.btpCharges))b.special.btpCharges=[];if(!b.special.btpCalc)b.special.btpCalc={};return b.special}
function viewBtp(b){const sp=btpData(b),total=sp.btpCharges.reduce((a,x)=>a+Number(x.total||0),0),today=new Date().toISOString().slice(0,10),todayTotal=sp.btpCharges.filter(x=>x.date===today).reduce((a,x)=>a+Number(x.total||0),0);return `<div class="btp-hero"><div class="row between"><div><h1>Module BTP</h1><p>Charges de matériaux et calculateurs de besoins — simple, rapide et adapté au chantier.</p></div><button class="hero-cta" onclick="openAccounting()">📚 Comptabilité</button></div></div><div class="btp-grid"><button class="btp-action" onclick="btpChargeForm()"><span class="ico">🧱</span><span><strong>Charges des matériaux</strong><small>Enregistrer ciment, sable, gravillon, fer, briques et autres matériaux.</small></span></button><button class="btp-action" onclick="btpConcreteCalc()"><span class="ico">🧮</span><span><strong>Calculateur dalle & béton</strong><small>Volume, sable en m³, gravillon en m³ et ciment en sacs.</small></span></button><button class="btp-action" onclick="btpBrickCalc()"><span class="ico">🧱</span><span><strong>Calculateur de briques</strong><small>Nombre selon la surface et caractéristiques personnalisables.</small></span></button><button class="btp-action" onclick="btpChargeHistory()"><span class="ico">📊</span><span><strong>Historique des charges</strong><small>Suivre les dépenses matériaux et imprimer le rapport.</small></span></button></div><div class="grid cols-3" style="margin-top:14px"><div class="card"><div class="muted">Charges totales</div><div class="kpi">${money(total)}</div></div><div class="card"><div class="muted">Charges aujourd’hui</div><div class="kpi">${money(todayTotal)}</div></div><div class="card"><div class="muted">Enregistrements</div><div class="kpi">${sp.btpCharges.length}</div></div></div>`}
function btpChargeForm(){const b=biz();showModal(`<h2>🏗️ Charge de matériau</h2><form onsubmit="saveBtpCharge(event)"><div class="form-grid"><div class="field"><label>Matériau</label><input name="material" placeholder="Ciment, sable, gravillon, fer…" required></div><div class="field"><label>Catégorie</label><select name="category"><option>Ciment</option><option>Sable</option><option>Gravillon</option><option>Brique</option><option>Fer / acier</option><option>Bois</option><option>Autre</option></select></div><div class="field"><label>Quantité</label><input name="qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Unité</label><select name="unit"><option>sac</option><option>m³</option><option>pièce</option><option>kg</option><option>tonne</option><option>ml</option><option>lot</option></select></div><div class="field"><label>Prix unitaire (Ar)</label><input name="unitPrice" type="number" min="0" required></div><div class="field"><label>Fournisseur</label><input name="supplier"></div><div class="field"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Chantier / référence</label><input name="project"></div><div class="field span2"><label>Note</label><textarea name="note" placeholder="Transport, livraison, observation…"></textarea></div></div><div class="row"><button>💾 Enregistrer</button><button type="button" class="secondary" onclick="closeModal()">Annuler</button></div></form>`)}
async function saveBtpCharge(e){e.preventDefault();const f=new FormData(e.target),b=biz(),q=Number(f.get('qty')),u=Number(f.get('unitPrice')),sp=btpData(b);sp.btpCharges.push({id:uid('btpc'),material:f.get('material'),category:f.get('category'),qty:q,unit:f.get('unit'),unitPrice:u,total:q*u,supplier:f.get('supplier'),date:f.get('date'),project:f.get('project'),note:f.get('note')});await persist();closeModal();renderContent();toast('Charge BTP enregistrée')}
function btpConcreteCalc(){showModal(`<h2>🧮 Besoin dalle / béton</h2><form onsubmit="calcBtpConcrete(event)"><div class="form-grid"><div class="field"><label>Type</label><select name="type"><option value="slab">Dalle</option><option value="concrete">Volume de béton</option></select></div><div class="field"><label>Dosage</label><select name="ratio"><option value="1:2:3">1:2:3 — standard</option><option value="1:2:4">1:2:4 — plus économique</option><option value="1:3:5">1:3:5 — léger</option></select></div><div class="field"><label>Longueur (m)</label><input name="length" type="number" step="0.001" min="0" required></div><div class="field"><label>Largeur (m)</label><input name="width" type="number" step="0.001" min="0" required></div><div class="field"><label>Épaisseur / hauteur (m)</label><input name="height" type="number" step="0.001" min="0" value="0.12" required></div><div class="field"><label>Poids d'un sac de ciment (kg)</label><input name="bag" type="number" step="0.1" min="1" value="50" required></div><div class="field"><label>Facteur volume sec</label><input name="dry" type="number" step="0.01" min="1" value="1.54" required></div><div class="field"><label>Densité ciment (kg/m³)</label><input name="density" type="number" step="1" min="500" value="1440" required></div></div><p class="muted">Les volumes de sable et gravillon sont affichés en <b>m³</b>. Le ciment est estimé en sacs selon le poids choisi.</p><button>Calculer</button></form><div id="btpCalcResult"></div>`)}
function calcBtpConcrete(e){e.preventDefault();const f=new FormData(e.target),L=Number(f.get('length')),W=Number(f.get('width')),H=Number(f.get('height')),dry=Number(f.get('dry')),bag=Number(f.get('bag')),density=Number(f.get('density'));let volume=L*W*H;if(f.get('type')==='concrete'){volume=L}const parts=f.get('ratio').split(':').map(Number),sum=parts.reduce((a,x)=>a+x,0),dryVol=volume*dry,cementVol=dryVol*parts[0]/sum,sand=dryVol*parts[1]/sum,gravel=dryVol*parts[2]/sum,cementKg=cementVol*density,sacks=cementKg/bag;$('btpCalcResult').innerHTML=`<div class="card" style="margin-top:14px"><h3>Résultats</h3><div class="result-grid"><div class="result"><span>Volume béton</span><strong>${volume.toFixed(3)} m³</strong></div><div class="result"><span>Sable</span><strong>${sand.toFixed(3)} m³</strong></div><div class="result"><span>Gravillon</span><strong>${gravel.toFixed(3)} m³</strong></div><div class="result"><span>Ciment</span><strong>${Math.ceil(sacks*10)/10} sacs</strong></div><div class="result"><span>Ciment estimé</span><strong>${cementKg.toFixed(1)} kg</strong></div></div><p class="muted">Calcul indicatif basé sur le dosage choisi et un facteur de volume sec configurable. À adapter aux prescriptions du chantier.</p></div>`}
function btpBrickCalc(){showModal(`<h2>🧱 Calculateur de briques</h2><form onsubmit="calcBtpBricks(event)"><div class="form-grid"><div class="field"><label>Longueur surface (m)</label><input name="surfaceL" type="number" step="0.001" min="0" required></div><div class="field"><label>Hauteur surface (m)</label><input name="surfaceH" type="number" step="0.001" min="0" required></div><div class="field"><label>Ouvertures à déduire (m²)</label><input name="openings" type="number" step="0.001" min="0" value="0"></div><div class="field"><label>Longueur brique (cm)</label><input name="bl" type="number" step="0.1" min="1" value="40" required></div><div class="field"><label>Hauteur brique (cm)</label><input name="bh" type="number" step="0.1" min="1" value="20" required></div><div class="field"><label>Épaisseur brique (cm)</label><input name="bt" type="number" step="0.1" min="1" value="15" required></div><div class="field"><label>Joint horizontal (cm)</label><input name="jh" type="number" step="0.1" min="0" value="1" required></div><div class="field"><label>Joint vertical (cm)</label><input name="jv" type="number" step="0.1" min="0" value="1" required></div><div class="field"><label>Perte / casse (%)</label><input name="waste" type="number" step="0.1" min="0" value="5"></div></div><p class="muted">Les dimensions et joints sont entièrement personnalisables. Le calcul utilise la surface couverte par une brique avec joints.</p><button>Calculer</button></form><div id="btpBrickResult"></div>`)}
function calcBtpBricks(e){e.preventDefault();const f=new FormData(e.target),area=Math.max(0,Number(f.get('surfaceL'))*Number(f.get('surfaceH'))-Number(f.get('openings')||0)),bw=(Number(f.get('bl'))+Number(f.get('jv')))/100,bh=(Number(f.get('bh'))+Number(f.get('jh')))/100,per=1/(bw*bh),w=1+Number(f.get('waste')||0)/100,count=Math.ceil(area*per*w);$('btpBrickResult').innerHTML=`<div class="card" style="margin-top:14px"><h3>Résultat</h3><div class="result-grid"><div class="result"><span>Surface nette</span><strong>${area.toFixed(2)} m²</strong></div><div class="result"><span>Briques / m²</span><strong>${per.toFixed(2)}</strong></div><div class="result"><span>Nombre conseillé</span><strong>${count}</strong></div></div><p class="muted">Marge de perte incluse : ${Number(f.get('waste')||0).toFixed(1)} %. Épaisseur : ${esc(f.get('bt'))} cm.</p></div>`}
function btpChargeHistory(){const b=biz(),sp=btpData(b),rows=sp.btpCharges.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.material)}</td><td>${esc(x.category)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.unitPrice)}</td><td>${money(x.total)}</td><td>${esc(x.supplier||'')}</td><td>${esc(x.project||'')}</td></tr>`).join('');showModal(`<div class="row between"><h2>Historique des charges BTP</h2><button class="secondary" onclick="printBtpCharges()">🖨️ Imprimer</button></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Matériau</th><th>Catégorie</th><th>Qté</th><th>PU</th><th>Total</th><th>Fournisseur</th><th>Chantier</th></tr>${rows||'<tr><td colspan="8" class="empty">Aucune charge enregistrée.</td></tr>'}</table></div>`)}
function printBtpCharges(){const b=biz(),sp=btpData(b),rows=sp.btpCharges.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.material)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.unitPrice)}</td><td>${money(x.total)}</td></tr>`).join(''),total=sp.btpCharges.reduce((a,x)=>a+Number(x.total||0),0);const w=window.open('','_blank');if(w){w.document.write(`<html><body style="font-family:Arial;padding:30px"><h1>VELOCE ERP MADA — Charges BTP</h1><p>${esc(state.company.name)} • NIF ${esc(state.company.nif)} • STAT ${esc(state.company.stat)} • RCS ${esc(state.company.rcs)}</p><table border="1" cellpadding="7" cellspacing="0" style="width:100%"><tr><th>Date</th><th>Matériau</th><th>Qté</th><th>PU</th><th>Total</th></tr>${rows}</table><h2>Total : ${money(total)}</h2><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}}
function viewCaisse(b){const open=b.cash.sessions.find(s=>!s.closedAt);const bal=b.cash.transactions.reduce((a,t)=>a+(t.type==='in'?t.amount:-t.amount),0);const day=new Date().toISOString().slice(0,10);const today=b.cash.transactions.filter(t=>t.date?.startsWith(day));return `<div class="grid cols-4"><div class="card"><div class="muted">Solde cumulé</div><div class="kpi">${money(bal)}</div></div><div class="card"><div class="muted">Caisse</div><div class="kpi">${open?money(open.opening):'Fermée'}</div></div><div class="card"><div class="muted">Entrées aujourd’hui</div><div class="kpi success-text">${money(today.filter(t=>t.type==='in').reduce((a,t)=>a+t.amount,0))}</div></div><div class="card"><div class="muted">Sorties aujourd’hui</div><div class="kpi danger-text">${money(today.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0))}</div></div></div><div class="grid cols-2" style="margin-top:14px"><div class="card"><div class="row between"><h2>Ouverture / clôture</h2>${open?`<button class="danger" onclick="closeCash()">Clôturer</button>`:`<button onclick="openCash()">Ouvrir la caisse</button>`}</div>${open?`<p>Ouverte le ${new Date(open.openedAt).toLocaleString('fr-FR')} • solde initial ${money(open.opening)}</p><p>Comptage attendu : <b>${money(cashExpected())}</b></p>`:'<p class="muted">Aucune caisse ouverte.</p>'}</div><div class="card"><h2>Mouvement</h2><form onsubmit="cashMove(event)"><div class="form-grid"><div class="field"><label>Type</label><select name="type"><option value="in">Entrée</option><option value="out">Sortie</option></select></div><div class="field"><label>Montant</label><input name="amount" type="number" min="0" required></div><div class="field"><label>Catégorie</label><input name="category" placeholder="Vente, dépense, salaire…" required></div><div class="field"><label>Bénéficiaire / fournisseur</label><input name="party" placeholder="Nom"></div><div class="field"><label>Compte</label><select name="account"><option>Espèces</option><option>MVola</option><option>Orange Money</option><option>Airtel Money</option><option>Banque</option></select></div><div class="field span2"><label>Note</label><input name="note"></div></div><button>Enregistrer</button></form></div></div><div class="card" style="margin-top:14px"><div class="row between"><h2>Historique</h2><div class="row"><input id="cashDate" type="date" value="${day}" onchange="renderContent()"><button class="secondary small" onclick="transferForm()">↔️ Transfert</button><button class="secondary small" onclick="printCash()">🖨️ Imprimer</button></div></div>${cashTable(b)}</div>`}
function cashExpected(){const b=biz(),open=b.cash.sessions.find(s=>!s.closedAt);if(!open)return 0;return open.opening+b.cash.transactions.filter(t=>t.sessionId===open.id&&t.account==='Espèces').reduce((a,t)=>a+(t.type==='in'?t.amount:-t.amount),0)}
function cashTable(b){const d=$('cashDate')?.value;const rows=b.cash.transactions.filter(t=>!d||t.date?.startsWith(d)).slice().reverse();return `<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Catégorie</th><th>Bénéficiaire</th><th>Compte</th><th>Montant</th></tr>${rows.map(t=>`<tr><td>${new Date(t.date).toLocaleString('fr-FR')}</td><td>${t.type==='in'?'Entrée':'Sortie'}</td><td>${esc(t.category)}</td><td>${esc(t.party)}</td><td>${esc(t.account)}</td><td>${money(t.amount)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucun mouvement</td></tr>'}</table></div>`}
async function openCash(){const b=biz();if(b.cash.sessions.some(s=>!s.closedAt))return toast('Une caisse est déjà ouverte.');const n=Number(prompt('Solde initial de la caisse (Ar) :','0'));if(!Number.isFinite(n)||n<0)return;b.cash.sessions.push({id:uid('cash'),openedAt:new Date().toISOString(),opening:n,closedAt:null});await persist();renderContent();toast('Caisse ouverte')}
async function closeCash(){const b=biz(),s=b.cash.sessions.find(x=>!x.closedAt);if(!s)return;const expected=cashExpected();const n=Number(prompt('Comptage réel de la caisse (Ar) :',String(expected)));if(!Number.isFinite(n)||n<0)return;const diff=n-expected;s.closedAt=new Date().toISOString();s.counted=n;s.expected=expected;s.difference=diff;await persist();renderContent();toast(`Caisse clôturée • écart ${money(diff)}`)}
async function cashMove(e){e.preventDefault();const b=biz(),f=new FormData(e.target),open=b.cash.sessions.find(s=>!s.closedAt);if(!open&&f.get('account')==='Espèces')return toast('Ouvrez la caisse avant un mouvement espèces.');b.cash.transactions.push({id:uid('tx'),sessionId:open?.id||null,date:new Date().toISOString(),type:f.get('type'),amount:Number(f.get('amount')),category:f.get('category'),party:f.get('party'),account:f.get('account'),note:f.get('note')});await persist();renderContent();toast('Mouvement enregistré')}
function transferForm(){showModal(`<h2>Transfert entre comptes</h2><form onsubmit="saveTransfer(event)"><div class="form-grid"><div class="field"><label>De</label><select name="from"><option>Espèces</option><option>MVola</option><option>Orange Money</option><option>Airtel Money</option><option>Banque</option></select></div><div class="field"><label>Vers</label><select name="to"><option>MVola</option><option>Orange Money</option><option>Airtel Money</option><option>Banque</option><option>Espèces</option></select></div><div class="field"><label>Montant</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Référence</label><input name="ref"></div></div><button>Enregistrer le transfert</button></form>`)}
async function saveTransfer(e){e.preventDefault();const f=new FormData(e.target),b=biz(),from=f.get('from'),to=f.get('to'),amount=Number(f.get('amount'));if(from===to||amount<=0)return toast('Transfert invalide.');b.cash.transfers.push({id:uid('trf'),date:new Date().toISOString(),from,to,amount,ref:f.get('ref')});const sid=b.cash.sessions.find(s=>!s.closedAt)?.id||null;b.cash.transactions.push({id:uid('tx'),sessionId:sid,date:new Date().toISOString(),type:'out',amount,category:'Transfert',party:to,account:from,note:f.get('ref')});b.cash.transactions.push({id:uid('tx'),sessionId:sid,date:new Date().toISOString(),type:'in',amount,category:'Transfert',party:from,account:to,note:f.get('ref')});await persist();closeModal();renderContent();toast('Transfert enregistré')}
function viewClients(b){return `<div class="card"><div class="row between"><h2>Clients • ${esc(b.name)}</h2><button onclick="clientForm()">+ Nouveau client</button></div><div class="table-wrap"><table class="table"><tr><th>Nom</th><th>NIF</th><th>STAT</th><th>RCS</th><th>Téléphone</th><th>Crédit max</th><th>Solde</th><th></th></tr>${b.customers.map(c=>{const due=clientDue(c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.nif)}</td><td>${esc(c.stat)}</td><td>${esc(c.rcs)}</td><td>${esc(c.phone)}</td><td>${money(c.creditLimit)}</td><td>${money(due)}</td><td><div class="row"><button class="small secondary" onclick="clientForm(biz().customers.find(x=>x.id==='${c.id}'))">Modifier</button><button class="small secondary" onclick="clientHistory('${c.id}')">Historique</button><button class="small danger" onclick="archiveClient('${c.id}')">${c.archived?'Réactiver':'Archiver'}</button></div></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">Aucun client</td></tr>'}</table></div></div>`}
async function archiveClient(id){const b=biz(),c=b.customers.find(x=>x.id===id);if(!c)return;if(clientDue(id)>0&&!c.archived)return toast('Impossible d’archiver un client avec un solde Trosa.');c.archived=!c.archived;await persist();renderContent();toast(c.archived?'Client archivé':'Client réactivé')}
function clientDue(id){const b=biz();return b.sales.filter(s=>s.customerId===id&&s.payment==='credit').reduce((a,s)=>a+s.total,0)-b.creditPayments.filter(p=>p.customerId===id).reduce((a,p)=>a+p.amount,0)}
function clientForm(existing){const c=existing||{};showModal(`<h2>${existing?'Modifier':'Nouveau'} client</h2><form onsubmit="saveClient(event,'${c.id||''}')"><div class="form-grid"><div class="field"><label>Nom / raison sociale</label><input name="name" value="${esc(c.name)}" required></div><div class="field"><label>Téléphone</label><input name="phone" value="${esc(c.phone)}"></div><div class="field"><label>NIF</label><input name="nif" value="${esc(c.nif)}"></div><div class="field"><label>STAT</label><input name="stat" value="${esc(c.stat)}"></div><div class="field"><label>RCS</label><input name="rcs" value="${esc(c.rcs)}"></div><div class="field"><label>Limite de crédit</label><input name="creditLimit" type="number" value="${c.creditLimit||0}"></div><div class="field span2"><label>Adresse</label><textarea name="address">${esc(c.address)}</textarea></div></div><div class="row"><button>Enregistrer</button><button type="button" class="secondary" onclick="closeModal()">Annuler</button></div></form>`)}
async function saveClient(e,id){e.preventDefault();const f=new FormData(e.target),b=biz(),c={id:id||uid('cli'),name:f.get('name'),phone:f.get('phone'),nif:f.get('nif'),stat:f.get('stat'),rcs:f.get('rcs'),creditLimit:Number(f.get('creditLimit')||0),address:f.get('address')};const i=b.customers.findIndex(x=>x.id===c.id);if(i>=0)b.customers[i]=c;else b.customers.push(c);await persist();closeModal();renderContent();toast('Client enregistré')}
function clientHistory(id){const b=biz(),c=b.customers.find(x=>x.id===id);const sales=b.sales.filter(s=>s.customerId===id), pays=b.creditPayments.filter(p=>p.customerId===id);showModal(`<h2>Historique • ${esc(c.name)}</h2><p>Solde Trosa : <b>${money(clientDue(id))}</b></p><h3>Factures</h3>${sales.map(s=>`<p>${s.invoiceNo} • ${new Date(s.date).toLocaleDateString('fr-FR')} • ${money(s.total)} • ${s.payment}</p>`).join('')||'<p class="muted">Aucune vente.</p>'}<h3>Paiements</h3>${pays.map(p=>`<p>${new Date(p.date).toLocaleDateString('fr-FR')} • ${money(p.amount)} • ${esc(p.note)}</p>`).join('')||'<p class="muted">Aucun paiement.</p>'}<div class="row"><button onclick="paymentForm('${id}')">+ Paiement Trosa</button><button class="secondary" onclick="printClient('${id}')">🖨️ Relevé</button><button class="secondary" onclick="printReceipt('${id}')">🧾 Reçu</button><button class="secondary" onclick="closeModal()">Fermer</button></div>`)}
async function paymentForm(id){const n=Number(prompt('Montant du paiement Trosa (Ar) :','0'));if(!Number.isFinite(n)||n<=0)return;const b=biz(),due=clientDue(id);if(n>due)return toast('Le paiement dépasse le solde.');b.creditPayments.push({id:uid('pay'),customerId:id,date:new Date().toISOString(),amount:n,note:'Paiement client'});b.cash.transactions.push({id:uid('tx'),sessionId:b.cash.sessions.find(s=>!s.closedAt)?.id||null,date:new Date().toISOString(),type:'in',amount:n,category:'Paiement Trosa',party:b.customers.find(c=>c.id===id)?.name,account:'Espèces',note:'Paiement client'});await persist();closeModal();renderContent();toast('Paiement enregistré')}
function printReceipt(id){const b=biz(),c=b.customers.find(x=>x.id===id),p=b.creditPayments.filter(x=>x.customerId===id).slice(-1)[0];if(!p)return toast('Aucun paiement récent.');const w=window.open('','_blank');if(w){w.document.write(`<html><body><h1>REÇU DE PAIEMENT</h1><h2>${esc(state.company.name)}</h2><p>Client : ${esc(c.name)}</p><p>Date : ${new Date(p.date).toLocaleString('fr-FR')}</p><h2>Montant reçu : ${money(p.amount)}</h2><p>Solde restant : ${money(clientDue(id))}</p><script>window.onload=()=>window.print()<\\/script></body></html>`);w.document.close()}}
function productForm(existing){const p=existing||{};showModal(`<h2>${existing?'Modifier':'Nouveau'} produit</h2><form onsubmit="saveProduct(event,'${p.id||''}')"><div class="form-grid"><div class="field"><label>Produit</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Référence</label><input name="sku" value="${esc(p.sku)}"></div><div class="field"><label>Prix achat</label><input name="buy" type="number" value="${p.buy||0}"></div><div class="field"><label>Prix vente</label><input name="sell" type="number" value="${p.sell||0}"></div><div class="field span2"><label>Tarifs clients (JSON: [{"customerId":"...","price":123}])</label><input name="customerPrices" value='${esc(JSON.stringify(p.customerPrices||[]))}'></div><div class="field"><label>Unité</label><input name="unit" value="${esc(p.unit||'pièce')}"></div><div class="field"><label>Seuil</label><input name="min" type="number" value="${p.min||0}"></div><div class="field"><label>Stock réservé</label><input name="reserved" type="number" value="${p.reserved||0}" min="0"></div><div class="field"><label>Emplacement</label><select name="location"><option>Principal</option></select></div><div class="field"><label>Lot</label><input name="batch" value="${esc(p.batch||'')}"></div><div class="field"><label>DLC / date d'expiration</label><input name="dlc" type="date" value="${esc(p.dlc||'')}"></div></div><div class="row"><button>Enregistrer</button><button type="button" class="secondary" onclick="closeModal()">Annuler</button></div></form>`)}
async function saveProduct(e,id){e.preventDefault();const f=new FormData(e.target),b=biz(),p={id:id||uid('prd'),name:f.get('name'),sku:f.get('sku'),buy:Number(f.get('buy')||0),sell:Number(f.get('sell')||0),unit:f.get('unit'),min:Number(f.get('min')||0),location:f.get('location'),batch:f.get('batch'),dlc:f.get('dlc'),reserved:Number(f.get('reserved')||0),customerPrices:(()=>{try{return JSON.parse(f.get('customerPrices')||'[]')}catch(e){return []}})()};const i=b.products.findIndex(x=>x.id===p.id);if(i>=0)b.products[i]=p;else b.products.push(p);await persist();closeModal();renderContent();toast('Produit enregistré')}
function latestDlc(id){const b=biz();const ds=b.stockMovements.filter(m=>m.productId===id&&(m.dlc||m.expiry)).map(m=>m.dlc||m.expiry).filter(Boolean).sort();return ds[0]||''}
function stockQty(id){const b=biz();return b.stockMovements.filter(m=>m.productId===id).reduce((a,m)=>a+(m.type==='in'?m.qty:-m.qty),0)}
function stockAvgCost(p){const b=biz(),ins=b.stockMovements.filter(m=>m.productId===p.id&&m.type==='in');let q=0,v=0;for(const m of ins){const cost=Number(m.unitCost||p.buy||0);q+=m.qty;v+=m.qty*cost}return q?v/q:Number(p.buy||0)}
function stockFifoValue(p){const b=biz(),ins=b.stockMovements.filter(m=>m.productId===p.id&&m.type==='in').sort((a,b)=>new Date(a.date)-new Date(b.date));let remaining=stockQty(p.id),value=0;for(const m of ins){if(remaining<=0)break;const take=Math.min(remaining,m.qty);value+=take*Number(m.unitCost||p.buy||0);remaining-=take}return value}
function viewStock(b){return `<div class="card"><div class="row between"><h2>Stocks • ${esc(b.name)}</h2><div class="row"><button onclick="productForm()">+ Produit</button><button class="secondary" onclick="stockMoveForm()">± Mouvement</button><button class="secondary" onclick="inventoryForm()">Inventaire</button><button class="secondary" onclick="stockTransferForm()">↔️ Transfert</button><button class="secondary" onclick="stockHistory()">📋 Mouvements</button><button class="secondary" onclick="printInventory()">🖨️ Inventaire</button></div></div><div class="table-wrap"><table class="table"><tr><th>Produit</th><th>Réf.</th><th>Stock</th><th>Réservé</th><th>Disponible</th><th>Seuil</th><th>Prix revente</th><th>DLC</th><th>CMUP</th><th>FIFO</th><th>Alerte</th><th>Emplacement</th></tr>${b.products.map(p=>{const q=stockQty(p.id);return `<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${q}</td><td>${p.reserved||0}</td><td>${q-(p.reserved||0)}</td><td>${p.min}</td><td>${money(p.sell||0)}</td><td>${esc(p.dlc||latestDlc(p.id)||'—')}</td><td>${money(stockAvgCost(p))}</td><td>${money(stockFifoValue(p))}</td><td>${q<=p.min?'⚠️':''}</td><td>${esc(p.location)}</td></tr>`}).join('')||'<tr><td colspan="12" class="empty">Aucun produit</td></tr>'}</table></div></div>`}
function stockMoveForm(){const b=biz();showModal(`<h2>Mouvement de stock</h2><form onsubmit="saveStockMove(event)"><div class="form-grid"><div class="field"><label>Produit</label><select name="productId">${b.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="type"><option value="in">Entrée</option><option value="out">Sortie</option></select></div><div class="field"><label>Quantité</label><input name="qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Motif</label><input name="reason" required></div><div class="field"><label>Lot</label><input name="batch"></div><div class="field"><label>Expiration</label><input name="expiry" type="date"></div></div><button>Enregistrer</button></form>`)}
async function saveStockMove(e){e.preventDefault();const f=new FormData(e.target),b=biz(),pid=f.get('productId'),qty=Number(f.get('qty')),type=f.get('type');if(type==='out'&&qty>stockQty(pid))return toast('Stock insuffisant.');b.stockMovements.push({id:uid('mov'),productId:pid,type,qty,reason:f.get('reason'),batch:f.get('batch'),dlc:f.get('dlc'),expiry:f.get('expiry'),unitCost:Number(b.products.find(p=>p.id===pid)?.buy||0),date:new Date().toISOString()});await persist();closeModal();renderContent();toast('Mouvement enregistré')}
function inventoryForm(){const b=biz();showModal(`<h2>Inventaire physique</h2><form onsubmit="saveInventory(event)"><div class="form-grid"><div class="field"><label>Produit</label><select name="productId">${b.products.map(p=>`<option value="${p.id}">${esc(p.name)} — système ${stockQty(p.id)}</option>`).join('')}</select></div><div class="field"><label>Quantité physique</label><input name="physical" type="number" min="0" required></div><div class="field span2"><label>Justification</label><textarea name="reason" required placeholder="Écart, casse, comptage…"></textarea></div></div><button>Valider l'inventaire</button></form>`)}
async function saveInventory(e){e.preventDefault();const f=new FormData(e.target),b=biz(),pid=f.get('productId'),phys=Number(f.get('physical')),cur=stockQty(pid),diff=phys-cur;if(diff){b.stockMovements.push({id:uid('inv'),productId:pid,type:diff>0?'in':'out',qty:Math.abs(diff),reason:'Inventaire: '+f.get('reason'),date:new Date().toISOString()});b.inventory.push({id:uid('inventory'),productId:pid,system:cur,physical:phys,difference:diff,date:new Date().toISOString(),reason:f.get('reason')})}await persist();closeModal();renderContent();toast('Inventaire enregistré')}
function stockTransferForm(){const b=biz();showModal(`<h2>Transfert de stock</h2><form onsubmit="saveStockTransfer(event)"><div class="form-grid"><div class="field"><label>Produit</label><select name="productId">${b.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantité</label><input name="qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>De</label><select name="from">${b.locations.map(l=>`<option>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>Vers</label><select name="to">${b.locations.map(l=>`<option>${esc(l.name)}</option>`).join('')}</select></div></div><button>Transférer</button></form>`)}
async function saveStockTransfer(e){e.preventDefault();const f=new FormData(e.target),b=biz(),pid=f.get('productId'),q=Number(f.get('qty'));if(f.get('from')===f.get('to')||q<=0)return toast('Transfert invalide.');if(q>stockQty(pid))return toast('Stock insuffisant.');b.stockMovements.push({id:uid('mov'),productId:pid,type:'out',qty:q,reason:'Transfert '+f.get('from')+' → '+f.get('to'),location:f.get('from'),date:new Date().toISOString()});b.stockMovements.push({id:uid('mov'),productId:pid,type:'in',qty:q,reason:'Transfert '+f.get('from')+' → '+f.get('to'),location:f.get('to'),date:new Date().toISOString()});await persist();closeModal();renderContent();toast('Transfert effectué')}
function stockHistory(){const b=biz();showModal(`<h2>Historique détaillé des stocks</h2><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Produit</th><th>Mouvement</th><th>Qté</th><th>Motif</th><th>Lot</th><th>Expiration</th><th>Emplacement</th></tr>${b.stockMovements.slice().reverse().map(m=>`<tr><td>${new Date(m.date).toLocaleString('fr-FR')}</td><td>${esc(b.products.find(p=>p.id===m.productId)?.name||'')}</td><td>${m.type}</td><td>${m.qty}</td><td>${esc(m.reason)}</td><td>${esc(m.batch||'')}</td><td>${esc(m.expiry||'')}</td><td>${esc(m.location||'')}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">Aucun mouvement</td></tr>'}</table></div><button class="secondary" onclick="closeModal()">Fermer</button>`)}
function printInventory(){const b=biz(),rows=b.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${stockQty(p.id)}</td><td>${p.min}</td></tr>`).join('');const w=window.open('','_blank');if(w){w.document.write(`<html><body><h1>Inventaire - ${esc(b.name)}</h1><table border="1" cellpadding="6"><tr><th>Produit</th><th>Réf.</th><th>Stock</th><th>Seuil</th></tr>${rows}</table><script>window.onload=()=>window.print()<\\/script></body></html>`);w.document.close()}}
function viewVentes(b){return `<div class="grid cols-2"><div class="card"><div class="row between"><h2>Nouvelle vente</h2><button onclick="saleForm()">+ Vente</button></div><p class="muted">Panier multi-lignes, recherche produit, remise, paiement comptant/crédit et échéance.</p></div><div class="card"><h2>Résumé</h2><p>Ventes : <b>${b.sales.length}</b></p><p>CA : <b>${money(b.sales.reduce((a,s)=>a+s.total,0))}</b></p></div></div><div class="card" style="margin-top:14px"><h2>Historique des ventes</h2><div class="table-wrap"><table class="table"><tr><th>Facture</th><th>Date</th><th>Client</th><th>Total</th><th>Paiement</th><th></th></tr>${b.sales.slice().reverse().map(s=>`<tr><td>${s.invoiceNo}</td><td>${new Date(s.date).toLocaleString('fr-FR')}</td><td>${esc(b.customers.find(c=>c.id===s.customerId)?.name||'Comptant')}</td><td>${money(s.total)}</td><td>${s.payment}</td><td><button class="small secondary" onclick="showSale('${s.id}')">Voir</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucune vente</td></tr>'}</table></div></div>`}

function addSaleLine(){const b=biz();window._saleLines.push({productId:b.products[0]?.id||'',qty:1,unit:b.products[0]?.sell||0,discount:0});renderSaleLines()}
function renderSaleLines(){const b=biz();$('saleLines').innerHTML=window._saleLines.map((l,i)=>`<div class="card" style="margin:8px 0"><div class="form-grid"><div class="field"><label>Produit</label><select class="sale-product" onchange="_saleLines[${i}].productId=this.value">${b.products.map(p=>`<option value="${p.id}" ${p.id===l.productId?'selected':''}>${esc(p.name)} — ${money(p.sell)}</option>`).join('')}</select></div><div class="field"><label>Quantité</label><input type="number" min="0.001" step="0.001" value="${l.qty}" onchange="_saleLines[${i}].qty=Number(this.value)"></div><div class="field"><label>Prix unitaire client</label><input type="number" min="0" value="${l.unit||b.products.find(p=>p.id===l.productId)?.sell||0}" onchange="_saleLines[${i}].unit=Number(this.value)"></div><div class="field"><label>Remise ligne</label><input type="number" min="0" value="${l.discount}" onchange="_saleLines[${i}].discount=Number(this.value)"></div><button type="button" class="danger small" onclick="_saleLines.splice(${i},1);addSaleLine()">Supprimer</button></div></div>`).join('')}
function filterSaleProducts(q){const term=q.toLowerCase();document.querySelectorAll('.sale-product').forEach(sel=>{[...sel.options].forEach(o=>o.hidden=!!term&&!o.textContent.toLowerCase().includes(term));});}
function customerPrice(p,cid){const c=p.customerPrices?.find(x=>x.customerId===cid);return c?Number(c.price):Number(p.sell||0)}
async function saveSale(e){
  e.preventDefault();
  const b=biz(),f=new FormData(e.target),customerType=f.get('customerType')||'anonymous',payment=f.get('payment'),account=f.get('account'),discount=Math.max(0,Number(f.get('discount')||0)),taxRate=Math.max(0,Number(f.get('taxRate')||0));
  let cid=f.get('customerId')||'';
  if(customerType==='new'){
    const name=String(f.get('newCustomerName')||'').trim();
    if(!name)return toast('Saisissez le nom du nouveau client.');
    const c={id:uid('cli'),name,phone:String(f.get('newCustomerPhone')||''),nif:String(f.get('newCustomerNif')||''),stat:String(f.get('newCustomerStat')||''),rcs:String(f.get('newCustomerRcs')||''),creditLimit:Number(f.get('newCustomerCreditLimit')||0),address:String(f.get('newCustomerAddress')||''),archived:false};
    b.customers.push(c);cid=c.id;
  }else if(customerType==='anonymous'){
    cid='';
  }else if(customerType==='existing' && !cid){
    return toast('Sélectionnez le client enregistré.');
  }
  const lines=window._saleLines.map(l=>{const p=b.products.find(x=>x.id===l.productId);return p?{...l,name:p.name,unit:Number(l.unit||customerPrice(p,cid)),amount:Math.max(0,Number(l.qty)*Number(l.unit||customerPrice(p,cid))-Number(l.discount||0)),buy:Number(p.buy||0)}:null}).filter(Boolean);
  if(!lines.length||lines.some(l=>l.qty<=0))return toast('Panier invalide.');
  for(const l of lines)if(l.qty>stockQty(l.productId)-(b.products.find(p=>p.id===l.productId)?.reserved||0))return toast('Stock disponible insuffisant pour '+l.name);
  const subtotal=lines.reduce((a,l)=>a+l.amount,0),net=Math.max(0,subtotal-discount),tva=net*taxRate/100,total=net+tva;
  if(payment==='credit'){
    if(!cid)return toast('Une vente à crédit nécessite un client identifié.');
    const c=b.customers.find(x=>x.id===cid),due=clientDue(cid);if(Number(c.creditLimit||0)>0&&due+total>Number(c.creditLimit))return toast('Limite de crédit dépassée.');
    if(!f.get('dueDate'))return toast('Indiquez la date d’échéance du Trosa.');
  }else if(account==='Espèces'&&!currentOpenCash(b))return toast('Ouvrez la caisse avant une vente en espèces.');
  const oldId=window._editSaleId, old=oldId?b.sales.find(x=>x.id===oldId):null;
  let no=old?.invoiceNo||state.settings.invoicePrefix+'-'+String(state.settings.invoiceNext++).padStart(5,'0');
  if(old){for(const l of old.lines)b.stockMovements.push({id:uid('mov'),productId:l.productId,type:'in',qty:l.qty,reason:'Correction vente '+old.invoiceNo,date:new Date().toISOString()});b.sales=b.sales.filter(x=>x.id!==oldId);b.invoices=b.invoices.filter(x=>x.id!==oldId)}
  const sale={id:oldId||uid('sale'),invoiceNo:no,date:new Date().toISOString(),customerId:cid||'',customerType,payment,lines,subtotal,discount,taxRate,tva,total,account:payment==='credit'?'':account,dueDate:payment==='credit'?f.get('dueDate'):'',terms:f.get('terms')||''};
  b.sales.push(sale);b.invoices.push({...sale,status:'issued'});
  for(const l of lines)b.stockMovements.push({id:uid('mov'),productId:l.productId,type:'out',qty:l.qty,unitCost:Number(l.buy||0),reason:'Vente '+no,date:new Date().toISOString()});
  addTva(b,{date:sale.date,type:'collectee',base:net,tva,ref:no});
  if(payment==='cash')addCashTx(b,{type:'in',amount:total,category:'Vente',party:cid?b.customers.find(c=>c.id===cid)?.name:'Client non identifié',account,note:no});
  await persist();closeModal();renderContent();toast(customerType==='new'?`Vente ${no} enregistrée • client ajouté aux Clients`:`Vente ${no} enregistrée : stock + TVA + caisse/Trosa + facture`);
}
function toggleSaleCustomer(){
  const type=document.querySelector('input[name="customerType"]:checked')?.value||'anonymous';
  const ex=$('existingCustomerBox'),nw=$('newCustomerBox');
  if(ex)ex.style.display=type==='existing'?'block':'none';
  if(nw)nw.style.display=type==='new'?'block':'none';
  if(type!=='existing'){const sel=document.querySelector('[name="customerId"]');if(sel)sel.value='';}
  renderSaleLines();
}
function showSale(id){const b=biz(),s=b.sales.find(x=>x.id===id);showModal(`<h2>Vente ${s.invoiceNo}</h2><p>Total : <b>${money(s.total)}</b></p>${s.lines.map(l=>`<p>${esc(l.name)} × ${l.qty} — ${money(l.amount)}</p>`).join('')}<div class="row"><button onclick="printInvoice('${id}')">🖨️ Facture</button><button class="secondary" onclick="closeModal()">Fermer</button></div>`)}
function viewFacturation(b){return `<div class="grid cols-3"><div class="card"><h3>Factures</h3><div class="kpi">${b.invoices.length}</div></div><div class="card"><h3>Devis</h3><div class="kpi">${b.quotes.length}</div><button class="small" onclick="docForm('quote')">+ Devis</button></div><div class="card"><h3>Commandes / BL</h3><div class="kpi">${b.orders.length} / ${b.deliveries.length}</div><button class="small" onclick="docForm('order')">+ Commande</button><button class="small" onclick="docForm('delivery')">+ BL</button></div></div><div class="card" style="margin-top:14px"><div class="row between"><h2>Factures</h2><button class="secondary" onclick="invoiceSettings()">⚙️ Numérotation / modèle</button></div><div class="table-wrap"><table class="table"><tr><th>N°</th><th>Date</th><th>Client</th><th>Total</th><th>Statut</th><th></th></tr>${b.invoices.slice().reverse().map(s=>`<tr><td>${s.invoiceNo}</td><td>${new Date(s.date).toLocaleDateString('fr-FR')}</td><td>${esc(b.customers.find(c=>c.id===s.customerId)?.name||'Comptant')}</td><td>${money(s.total)}</td><td>${s.status}</td><td><button class="small" onclick="printInvoice('${s.id}')">🖨️ PDF / Imprimer</button><button class="small secondary" onclick="editInvoice('${s.id}')">Modifier</button><button class="small secondary" onclick="cancelInvoice('${s.id}')">Annuler</button><button class="small secondary" onclick="returnInvoice('${s.id}')">Avoir/Retour</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucune facture</td></tr>'}</table></div></div>`}
async function editInvoice(id){const b=biz(),s=b.invoices.find(x=>x.id===id);if(!s||s.status==='cancelled'||s.status==='credit_note')return toast('Facture non modifiable.');if(!confirm('Modifier cette facture ? Le stock sera recalculé.'))return;for(const l of s.lines)b.stockMovements.push({id:uid('mov'),productId:l.productId,type:'in',qty:l.qty,reason:'Annulation technique pour modification '+s.invoiceNo,date:new Date().toISOString()});b.sales=b.sales.filter(x=>x.id!==id);b.invoices=b.invoices.filter(x=>x.id!==id);await persist();closeModal();saleForm();toast('Ancienne facture annulée : recréez la vente corrigée.')}
async function cancelInvoice(id){const b=biz(),s=b.invoices.find(x=>x.id===id);if(!s||s.status==='cancelled')return;if(!confirm('Annuler cette facture ?'))return;s.status='cancelled';for(const l of s.lines)b.stockMovements.push({id:uid('mov'),productId:l.productId,type:'in',qty:l.qty,reason:'Annulation '+s.invoiceNo,date:new Date().toISOString()});await persist();renderContent();toast('Facture annulée')}
async function returnInvoice(id){const b=biz(),s=b.invoices.find(x=>x.id===id);if(!s)return;showModal(`<h2>Retour / avoir • ${esc(s.invoiceNo)}</h2><form onsubmit="saveReturn(event,'${id}')"><div class="form-grid">${s.lines.map((l,i)=>`<div class="field"><label>${esc(l.name)} — Qté max ${l.qty}</label><input name="q${i}" type="number" min="0" max="${l.qty}" step="0.001" value="0"></div>`).join('')}<div class="field span2"><label>Motif</label><input name="reason" required></div></div><button>Créer l'avoir et réintégrer le stock</button></form>`)}
async function saveReturn(e,id){e.preventDefault();const b=biz(),s=b.invoices.find(x=>x.id===id),f=new FormData(e.target),items=[];s.lines.forEach((l,i)=>{const q=Number(f.get('q'+i)||0);if(q>0)items.push({productId:l.productId,qty:q,amount:q*l.unit})});if(!items.length)return toast('Aucune quantité retournée.');const total=items.reduce((a,x)=>a+x.amount,0);items.forEach(x=>b.stockMovements.push({id:uid('mov'),productId:x.productId,type:'in',qty:x.qty,reason:'Retour client / avoir',date:new Date().toISOString()}));b.returns.push({id:uid('ret'),invoiceId:id,date:new Date().toISOString(),items,total,reason:f.get('reason')});b.invoices.push({...s,id:uid('av'),invoiceNo:'AV-'+s.invoiceNo,date:new Date().toISOString(),total:-total,lines:items.map(x=>({name:b.products.find(p=>p.id===x.productId)?.name,qty:x.qty,unit:x.amount/x.qty,amount:-x.amount})),status:'credit_note'});await persist();closeModal();renderContent();toast('Avoir créé')}

function normalizeState(){
  if(!state)return;
  state.version=Math.max(Number(state.version||0),680);
  state.payroll=Array.isArray(state.payroll)?state.payroll:[];
  state.employeeDebts=Array.isArray(state.employeeDebts)?state.employeeDebts:[];
  state.taxLedger=Array.isArray(state.taxLedger)?state.taxLedger:[];
  for(const [id] of BIZ){
    const b=state.businesses[id] ||= {name:id,customers:[],suppliers:[],products:[],sales:[],invoices:[],quotes:[],orders:[],deliveries:[],purchases:[],cash:{sessions:[],transactions:[],transfers:[]},stockMovements:[],returns:[],inventory:[],creditPayments:[],locations:[{id:'main',name:'Principal'}],batches:[],special:{}};
    b.customers ||= []; b.suppliers ||= []; b.products ||= []; b.sales ||= []; b.invoices ||= [];
    b.purchases ||= []; b.stockMovements ||= []; b.creditPayments ||= []; b.returns ||= [];
    b.cash ||= {sessions:[],transactions:[],transfers:[]}; b.cash.sessions ||= []; b.cash.transactions ||= []; b.cash.transfers ||= [];
    b.locations ||= [{id:'main',name:'Principal'}]; b.special ||= {};
    b.tvaLedger ||= []; b.supplierDebts ||= []; b.accounting ||= {manualEntries:[],periodLock:null};
    if(id==='tilapia'){
      b.special.tilapia ||= {ponds:[],feed:[],mortality:[],growth:[],harvests:[],seedCosts:[]};
    }
  }
}
function currentOpenCash(b){return b.cash.sessions.find(s=>!s.closedAt)}
function accountBalance(b,account){return b.cash.transactions.filter(t=>t.account===account).reduce((a,t)=>a+(t.type==='in'?Number(t.amount): -Number(t.amount)),0)}
function addCashTx(b,{type,amount,category,party='',account='Espèces',note='',sessionId=null}){
  const n=Number(amount)||0;if(n<=0)return;
  const open=currentOpenCash(b);
  if(account==='Espèces' && !open)throw Error('Ouvrez la caisse avant un mouvement espèces.');
  b.cash.transactions.push({id:uid('tx'),sessionId:sessionId||open?.id||null,date:new Date().toISOString(),type,amount:n,category,party,account,note});
}
function addTva(b,{date,type,base,tva,ref}){b.tvaLedger.push({id:uid('tva'),date,type,base:Number(base)||0,tva:Number(tva)||0,ref:ref||''})}
function supplierDebt(b,supplierId){return b.supplierDebts.filter(d=>d.supplierId===supplierId).reduce((a,d)=>a+Number(d.amount||0),0)}
function employeeDebt(empId){return state.employeeDebts.filter(d=>d.employeeId===empId).reduce((a,d)=>a+Number(d.amount||0),0)}

async function saveSale(e){
  e.preventDefault();const b=biz(),f=new FormData(e.target),cid=f.get('customerId'),payment=f.get('payment'),account=f.get('account'),discount=Math.max(0,Number(f.get('discount')||0)),taxRate=Math.max(0,Number(f.get('taxRate')||0));
  const lines=window._saleLines.map(l=>{const p=b.products.find(x=>x.id===l.productId);return p?{...l,name:p.name,unit:Number(l.unit||customerPrice(p,cid)),amount:Math.max(0,Number(l.qty)*Number(l.unit||customerPrice(p,cid))-Number(l.discount||0)),buy:Number(p.buy||0)}:null}).filter(Boolean);
  if(!lines.length||lines.some(l=>l.qty<=0))return toast('Panier invalide.');
  for(const l of lines)if(l.qty>stockQty(l.productId)-(b.products.find(p=>p.id===l.productId)?.reserved||0))return toast('Stock disponible insuffisant pour '+l.name);
  const subtotal=lines.reduce((a,l)=>a+l.amount,0),net=Math.max(0,subtotal-discount),tva=net*taxRate/100,total=net+tva;
  if(payment==='credit'){

    const c=b.customers.find(x=>x.id===cid),due=clientDue(cid);if(Number(c.creditLimit||0)>0&&due+total>Number(c.creditLimit))return toast('Limite de crédit dépassée.');
  }else if(account==='Espèces'&&!currentOpenCash(b))return toast('Ouvrez la caisse avant une vente en espèces.');
  const oldId=window._editSaleId, old=oldId?b.sales.find(x=>x.id===oldId):null;
  let no=old?.invoiceNo||state.settings.invoicePrefix+'-'+String(state.settings.invoiceNext++).padStart(5,'0');
  if(old){for(const l of old.lines)b.stockMovements.push({id:uid('mov'),productId:l.productId,type:'in',qty:l.qty,reason:'Correction vente '+old.invoiceNo,date:new Date().toISOString()});b.sales=b.sales.filter(x=>x.id!==oldId);b.invoices=b.invoices.filter(x=>x.id!==oldId)}
  const sale={id:oldId||uid('sale'),invoiceNo:no,date:new Date().toISOString(),customerId:cid||'',lines,subtotal,discount,taxRate,tva,total,payment,account:payment==='credit'?'':account,dueDate:f.get('dueDate'),terms:f.get('terms')||''};
  b.sales.push(sale);b.invoices.push({...sale,status:'issued'});
  for(const l of lines)b.stockMovements.push({id:uid('mov'),productId:l.productId,type:'out',qty:l.qty,unitCost:Number(l.buy||0),reason:'Vente '+no,date:new Date().toISOString()});
  addTva(b,{date:sale.date,type:'collectee',base:net,tva,ref:no});
  if(payment==='cash')addCashTx(b,{type:'in',amount:total,category:'Vente',party:cid?b.customers.find(c=>c.id===cid)?.name:'Comptant',account,note:no});
  await persist();closeModal();renderContent();toast('Vente '+no+' enregistrée : stock + TVA + caisse/Trosa + facture');
}

async function savePurchase(e){
  e.preventDefault();

    let product=b.products.find(p=>(l.sku&&p.sku&&p.sku.toLowerCase()===String(l.sku).toLowerCase())||p.name.trim().toLowerCase()===String(l.name).trim().toLowerCase());
    if(!product){product={id:uid('prod'),name:String(l.name).trim(),sku:String(l.sku||'').trim(),category:String(l.category||'').trim(),unit:String(l.unit||'pièce'),buy,sell,min:0,reserved:0,location:'Principal',batch:l.batch||'',dlc:l.dlc||'',customerPrices:[]};b.products.push(product)}
    else {product.buy=buy||product.buy;product.sell=sell||product.sell;product.category=l.category||product.category;product.unit=l.unit||product.unit;product.batch=l.batch||product.batch;product.dlc=l.dlc||product.dlc}
    const pur={id:uid('pur'),supplierId:sup.id,productId:product.id,ordered,received,unit:buy,resale:sell,due:f.get('due'),date,status:received>=ordered?'received':received>0?'partial':'ordered',taxRate,tva,total,paid:0,dlc:l.dlc||'',batch:l.batch||'',note:f.get('note')||''};

  if(paymentMode==='advance' && !dueRaw)return toast('Indiquez la date de règlement du solde fournisseur.');

 ['101','Capital'],['106','Réserves'],['110','Report à nouveau créditeur'],['119','Report à nouveau débiteur'],['120','Résultat de l’exercice – bénéfice'],['129','Résultat de l’exercice – perte'],

];
function accountingInit(b){b.accounting ||= {manualEntries:[],periodLock:null};b.accounting.manualEntries ||= [];return b.accounting}
function accDate(d){return d?new Date(d).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}
function accMoney(n){return Number(n||0)}
function cashAccount(a){return a==='Espèces'?'531':a==='Banque'?'512':a==='MVola'?'5121':a==='Orange Money'?'5122':a==='Airtel Money'?'5123':'512'}
function purchaseAccount(b){return activeBiz==='btp'?'601':activeBiz==='tilapia'?'602':(activeBiz==='epicerie'||activeBiz==='ppn'||activeBiz==='friperie'?'607':'607')}
function manualAccountingEntries(b){return (accountingInit(b).manualEntries||[]).map(e=>({...e,source:'Manuel',sourceId:e.id}))}
function generatedAccountingEntries(b){
  const out=[];
  for(const p of b.purchases||[]){
    const base=accMoney(p.total)-accMoney(p.tva), tva=accMoney(p.tva), total=accMoney(p.total); if(total<=0)continue;
    const ref='ACH-'+p.id.slice(-7); const date=accDate(p.date); const pa=purchaseAccount(b);
    out.push({id:'g-'+p.id+'-b',date,journal:'ACH',ref,label:'Achat / réception',account:pa,debit:base,credit:0,source:'Achat',sourceId:p.id});
    if(tva>0)out.push({id:'g-'+p.id+'-t',date,journal:'ACH',ref,label:'TVA déductible achat',account:'4456',debit:tva,credit:0,source:'Achat',sourceId:p.id});
    const paid=accMoney(p.paid), debt=total-paid;
    if(debt>0)out.push({id:'g-'+p.id+'-f',date,journal:'ACH',ref,label:'Dette fournisseur',account:'401',debit:0,credit:debt,source:'Achat',sourceId:p.id});
    if(paid>0)out.push({id:'g-'+p.id+'-c',date,journal:'BQ',ref,label:'Règlement achat',account:cashAccount(p.paymentAccount),debit:0,credit:paid,source:'Achat',sourceId:p.id});
  }
  for(const s of b.sales||[]){
    if(s.status==='cancelled')continue; const total=accMoney(s.total), tva=accMoney(s.tva), base=Math.max(0,total-tva); if(total<=0)continue;
    const ref=s.invoiceNo||('VTE-'+s.id.slice(-7)),date=accDate(s.date); const debitAcc=s.payment==='credit'?'411':cashAccount(s.account);
    out.push({id:'g-'+s.id+'-d',date,journal:'VTE',ref,label:'Créance / encaissement vente',account:debitAcc,debit:total,credit:0,source:'Vente',sourceId:s.id});
    out.push({id:'g-'+s.id+'-p',date,journal:'VTE',ref,label:'Produit de vente',account:'70',debit:0,credit:base,source:'Vente',sourceId:s.id});
    if(tva>0)out.push({id:'g-'+s.id+'-t',date,journal:'VTE',ref,label:'TVA collectée',account:'4457',debit:0,credit:tva,source:'Vente',sourceId:s.id});
    const cost=(s.lines||[]).reduce((a,l)=>a+accMoney(l.buy)*accMoney(l.qty),0);
    if(cost>0){out.push({id:'g-'+s.id+'-c',date,journal:'OD',ref,label:'Coût des marchandises vendues',account:activeBiz==='btp'?'601':'607',debit:cost,credit:0,source:'Vente',sourceId:s.id});out.push({id:'g-'+s.id+'-s',date,journal:'OD',ref,label:'Sortie de stock',account:activeBiz==='btp'?'31':'37',debit:0,credit:cost,source:'Vente',sourceId:s.id});}
  }
  for(const cp of b.creditPayments||[]){const a=accMoney(cp.amount);if(a>0)out.push({id:'g-'+cp.id+'-d',date:accDate(cp.date),journal:'BQ',ref:'REG-'+cp.id.slice(-7),label:'Règlement client Trosa',account:'531',debit:a,credit:0,source:'Paiement client',sourceId:cp.id},{id:'g-'+cp.id+'-c',date:accDate(cp.date),journal:'BQ',ref:'REG-'+cp.id.slice(-7),label:'Extinction créance client',account:'411',debit:0,credit:a,source:'Paiement client',sourceId:cp.id})}
  for(const d of b.supplierDebts||[]){/* debt itself is generated by purchases; settlement is read from cash below */}
  for(const tx of b.cash.transactions||[]){
    const a=accMoney(tx.amount);if(a<=0)continue;const ca=cashAccount(tx.account),ref='CAI-'+tx.id.slice(-7),date=accDate(tx.date);
    if(tx.category==='Paiement fournisseur'){out.push({id:'g-'+tx.id+'-d',date,journal:'BQ',ref,label:'Règlement fournisseur',account:'401',debit:a,credit:0,source:'Fournisseur',sourceId:tx.id},{id:'g-'+tx.id+'-c',date,journal:'BQ',ref,label:'Sortie trésorerie fournisseur',account:ca,debit:0,credit:a,source:'Fournisseur',sourceId:tx.id});continue}
    if(tx.category==='Salaire net'){out.push({id:'g-'+tx.id+'-d',date,journal:'BQ',ref,label:'Paiement salaire net',account:'421',debit:a,credit:0,source:'Paie',sourceId:tx.id},{id:'g-'+tx.id+'-c',date,journal:'BQ',ref,label:'Sortie trésorerie salaire',account:ca,debit:0,credit:a,source:'Paie',sourceId:tx.id});continue}
    if(['Vente','Achat fournisseur','Paiement Trosa','Aliment Tilapia','Transfert','Achat'].includes(tx.category))continue;
    if(tx.type==='out')out.push({id:'g-'+tx.id+'-d',date,journal:'BQ',ref,label:tx.category||'Sortie de trésorerie',account:'60',debit:a,credit:0,source:'Caisse',sourceId:tx.id},{id:'g-'+tx.id+'-c',date,journal:'BQ',ref,label:'Sortie trésorerie',account:ca,debit:0,credit:a,source:'Caisse',sourceId:tx.id});
    else out.push({id:'g-'+tx.id+'-d',date,journal:'BQ',ref,label:'Entrée de trésorerie',account:ca,debit:a,credit:0,source:'Caisse',sourceId:tx.id},{id:'g-'+tx.id+'-c',date,journal:'BQ',ref,label:tx.category||'Recette',account:'75',debit:0,credit:a,source:'Caisse',sourceId:tx.id});

function accountingStatements(){const b=biz(),s=accountingSummary(b),bal={};for(const e of s.entries){bal[e.account] ||= {d:0,c:0};bal[e.account].d+=e.debit;bal[e.account].c+=e.credit}const assets=['2','3','4','5'].map(c=>Object.entries(bal).filter(([k])=>accountClass(k)===c).reduce((a,[k,v])=>a+v.d-v.c,0)).reduce((a,x)=>a+x,0),liab=['1','4','5'].map(c=>Object.entries(bal).filter(([k])=>accountClass(k)===c).reduce((a,[k,v])=>a+v.c-v.d,0)).reduce((a,x)=>a+x,0),charges=Object.entries(bal).filter(([k])=>accountClass(k)==='6').reduce((a,[k,v])=>a+v.d-v.c,0),products=Object.entries(bal).filter(([k])=>accountClass(k)==='7').reduce((a,[k,v])=>a+v.c-v.d,0),result=products-charges;const cash=Object.entries(bal).filter(([k])=>['531','512','5121','5122','5123'].includes(k)).reduce((a,[k,v])=>a+v.d-v.c,0);$('accountingPanel').innerHTML=`<div class="grid cols-2"><div class="card"><h2>📑 Bilan</h2><table class="table" style="min-width:0"><tr><th>ACTIF</th><th>Montant</th></tr><tr><td>Immobilisations / stocks / tiers / trésorerie</td><td>${money(assets)}</td></tr><tr><th>TOTAL ACTIF</th><th>${money(assets)}</th></tr></table><hr><table class="table" style="min-width:0"><tr><th>PASSIF</th><th>Montant</th></tr><tr><td>Capitaux + dettes</td><td>${money(liab)}</td></tr><tr><td>Résultat de l’exercice</td><td>${money(result)}</td></tr><tr><th>TOTAL PASSIF</th><th>${money(liab+result)}</th></tr></table></div><div class="card"><h2>📈 Compte de résultat</h2><p>Produits des classes 7 : <b>${money(products)}</b></p><p>Charges des classes 6 : <b>${money(charges)}</b></p><p class="kpi ${result<0?'danger-text':'success-text'}">${result>=0?'Bénéfice':'Perte'} : ${money(Math.abs(result))}</p><hr><h3>💧 Trésorerie</h3><p>Banque + caisse comptabilisés : <b>${money(cash)}</b></p></div></div><div class="card acct-section"><h2>📊 Tableau des flux de trésorerie — synthèse</h2><p>Encaissements et décaissements issus des journaux Banque/Caisse : <b>${money(cash)}</b> de solde net.</p><p class="muted">La présentation détaillée peut être complétée par les travaux de clôture et les écritures d’inventaire.</p></div>`}

      <div class="form-grid" style="margin-top:12px">
        <div class="field"><label>Mode de règlement</label><select name="paymentMode" onchange="purchasePaymentModeChanged(this.value)"><option value="full">Paiement total de la commande</option><option value="advance">Paiement partiel / avance</option></select></div>
        <div class="field"><label>Montant payé</label><input id="purchasePaid" name="paid" type="number" min="0" step="0.01" value="0" oninput="purchasePaidChanged()"></div>
        <div class="field"><label>Compte de paiement</label><select name="account"><option>Espèces</option><option>MVola</option><option>Orange Money</option><option>Airtel Money</option><option>Banque</option></select></div>
        <div class="field"><label>Date de règlement du solde</label><input id="purchaseDue" name="due" type="date"></div>
        <div class="field span2"><label>Note / référence fournisseur</label><input name="note"></div>
      </div>
      <div id="purchasePaymentInfo" class="card" style="margin-top:12px"><b>Paiement total sélectionné.</b> La dette fournisseur sera automatiquement à zéro.</div>
      <div id="purchaseTotal" class="card" style="margin-top:12px"><b>Total achat : 0 Ar</b></div>
      <button type="submit" style="margin-top:12px">💾 Enregistrer l'achat</button>
    </form>`);
  window._purchaseLines=[];
  addPurchaseLine();
}
function addPurchaseLine(seed={}){
  window._purchaseLines.push({...seed,id:uid('pline'),name:seed.name||'',sku:seed.sku||'',category:seed.category||'',unit:seed.unit||'pièce',ordered:seed.ordered??1,received:seed.received??1,buy:seed.buy??0,sell:seed.sell??0,taxRate:seed.taxRate??Number(state.settings.taxRate||20),dlc:seed.dlc||'',batch:seed.batch||''});
  renderPurchaseLines();
}
function removePurchaseLine(id){window._purchaseLines=window._purchaseLines.filter(x=>x.id!==id);if(!window._purchaseLines.length)addPurchaseLine();else renderPurchaseLines()}
function syncPurchaseLine(id,field,value){const l=window._purchaseLines.find(x=>x.id===id);if(!l)return;if(['ordered','received','buy','sell','taxRate'].includes(field))l[field]=Number(value)||0;else l[field]=value;updatePurchaseTotal()}
function renderPurchaseLines(){
  const el=$('purchaseLines');if(!el)return;
  el.innerHTML=window._purchaseLines.map((l,i)=>`<div class="card" style="margin:8px 0;padding:10px">
    <div class="row between"><b>Ligne ${i+1}</b>${window._purchaseLines.length>1?`<button type="button" class="small secondary" onclick="removePurchaseLine('${l.id}')">✕</button>`:''}</div>
    <div class="form-grid">
      <div class="field span2"><label>Marchandise / produit</label><input value="${esc(l.name)}" oninput="syncPurchaseLine('${l.id}','name',this.value)" placeholder="Ex. Riz 25 kg" required></div>
      <div class="field"><label>Référence</label><input value="${esc(l.sku)}" oninput="syncPurchaseLine('${l.id}','sku',this.value)"></div>
      <div class="field"><label>Catégorie</label><input value="${esc(l.category)}" oninput="syncPurchaseLine('${l.id}','category',this.value)"></div>
      <div class="field"><label>Unité</label><input value="${esc(l.unit)}" oninput="syncPurchaseLine('${l.id}','unit',this.value)"></div>
      <div class="field"><label>Qté commandée</label><input type="number" min="0" step="0.001" value="${l.ordered}" oninput="syncPurchaseLine('${l.id}','ordered',this.value)"></div>
      <div class="field"><label>Qté reçue / stock</label><input type="number" min="0" step="0.001" value="${l.received}" oninput="syncPurchaseLine('${l.id}','received',this.value)"></div>
      <div class="field"><label>Prix achat HT / unité</label><input type="number" min="0" step="0.01" value="${l.buy}" oninput="syncPurchaseLine('${l.id}','buy',this.value)" required></div>
      <div class="field"><label>Prix revente / unité</label><input type="number" min="0" step="0.01" value="${l.sell}" oninput="syncPurchaseLine('${l.id}','sell',this.value)" placeholder="Libre à la saisie"></div>
      <div class="field"><label>TVA (%)</label><input type="number" min="0" step="0.01" value="${l.taxRate}" oninput="syncPurchaseLine('${l.id}','taxRate',this.value)"></div>
      <div class="field"><label>DLC / date d'expiration</label><input type="date" value="${esc(l.dlc)}" oninput="syncPurchaseLine('${l.id}','dlc',this.value)"></div>
      <div class="field"><label>Lot</label><input value="${esc(l.batch)}" oninput="syncPurchaseLine('${l.id}','batch',this.value)"></div>
    </div></div>`).join('');
  updatePurchaseTotal();
}
function purchaseGrandTotal(){let base=0,tva=0;for(const l of window._purchaseLines||[]){const qty=Math.max(0,Number(l.received)||0),pu=Math.max(0,Number(l.buy)||0),b=qty*pu;base+=b;tva+=b*Math.max(0,Number(l.taxRate)||0)/100}return {base,tva,total:base+tva}}
function purchasePaymentModeChanged(mode){const paid=$('purchasePaid'),due=$('purchaseDue'),info=$('purchasePaymentInfo'),total=purchaseGrandTotal().total;if(mode==='full'){if(paid){paid.value=total.toFixed(2);paid.disabled=true}if(due){due.value='';due.disabled=true}if(info)info.innerHTML=`<b>Paiement total : ${money(total)}</b><span class="muted"> • aucune dette fournisseur • aucune date de règlement.</span>`}else{if(paid){paid.disabled=false;if(Number(paid.value)>=total)paid.value='0'}if(due)due.disabled=false;if(info)info.innerHTML='<b>Paiement partiel / avance.</b><span class="muted"> Le solde devient une dette fournisseur et une échéance est obligatoire.</span>'}}
function purchasePaidChanged(){if(document.querySelector('form[onsubmit="savePurchase(event)"] select[name="paymentMode"]')?.value==='full')purchasePaymentModeChanged('full')}
function updatePurchaseTotal(){const el=$('purchaseTotal');if(!el)return;const {base,tva,total}=purchaseGrandTotal();el.innerHTML=`<b>Total achat : ${money(total)}</b><span class="muted"> • HT ${money(base)} • TVA ${money(tva)}</span>`;if(document.querySelector('form[onsubmit="savePurchase(event)"] select[name="paymentMode"]')?.value==='full')purchasePaymentModeChanged('full')}
async function savePurchase(e){
  e.preventDefault();
  try{
    const f=new FormData(e.target),b=biz(),lines=(window._purchaseLines||[]).filter(l=>String(l.name||'').trim() && Number(l.received)>=0);
    if(!lines.length)throw Error('Ajoutez au moins une marchandise.');
    const supplierName=String(f.get('supplierName')||'').trim();if(!supplierName)throw Error('Saisissez le fournisseur.');
    let sup=b.suppliers.find(s=>String(s.name||'').trim().toLowerCase()===supplierName.toLowerCase());
    if(!sup){sup={id:uid('sup'),name:supplierName,phone:f.get('supplierPhone')||'',nif:f.get('supplierNif')||'',stat:f.get('supplierStat')||'',rcs:f.get('supplierRcs')||'',archived:false};b.suppliers.push(sup)}
    else{if(f.get('supplierPhone'))sup.phone=f.get('supplierPhone');if(f.get('supplierNif'))sup.nif=f.get('supplierNif');if(f.get('supplierStat'))sup.stat=f.get('supplierStat');if(f.get('supplierRcs'))sup.rcs=f.get('supplierRcs')}
    const date=f.get('purchaseDate')?new Date(f.get('purchaseDate')+'T12:00:00').toISOString():new Date().toISOString();
    let grandTotal=0;
    for(const l of lines){
      const ordered=Math.max(0,Number(l.ordered)||0),received=Math.max(0,Number(l.received)||0),buy=Math.max(0,Number(l.buy)||0),sell=Math.max(0,Number(l.sell)||0),taxRate=Math.max(0,Number(l.taxRate)||0),base=received*buy,tva=base*taxRate/100,total=base+tva;
      if(ordered<=0)throw Error(`Quantité commandée invalide pour ${l.name}.`);
      let product=b.products.find(p=>(l.sku&&p.sku&&String(p.sku).toLowerCase()===String(l.sku).toLowerCase())||String(p.name||'').trim().toLowerCase()===String(l.name).trim().toLowerCase());
      if(!product){product={id:uid('prod'),name:String(l.name).trim(),sku:String(l.sku||'').trim(),category:String(l.category||'').trim(),unit:String(l.unit||'pièce'),buy,sell,min:0,reserved:0,location:'Principal',batch:l.batch||'',dlc:l.dlc||'',customerPrices:[]};b.products.push(product)}
      else{if(buy>0)product.buy=buy;if(sell>0)product.sell=sell;if(l.category)product.category=l.category;if(l.unit)product.unit=l.unit;if(l.batch)product.batch=l.batch;if(l.dlc)product.dlc=l.dlc}
      const pur={id:uid('pur'),supplierId:sup.id,productId:product.id,ordered,received,unit:buy,resale:sell,due:'',date,status:received>=ordered?'received':received>0?'partial':'ordered',taxRate,tva,total,paid:0,paymentAccount:f.get('account')||'Espèces',dlc:l.dlc||'',batch:l.batch||'',note:f.get('note')||''};
      b.purchases.push(pur);
      if(received>0)b.stockMovements.push({id:uid('mov'),productId:product.id,type:'in',qty:received,unitCost:buy,reason:'Réception achat • '+supplierName,batch:l.batch||'',expiry:l.dlc||'',dlc:l.dlc||'',location:product.location||'Principal',date});
      addTva(b,{date,type:'deductible',base,tva,ref:pur.id});
      grandTotal+=total;
    }
    if(grandTotal<=0)throw Error('Le total de l’achat doit être supérieur à 0.');
    const paymentMode=f.get('paymentMode')==='advance'?'advance':'full';
    const paid=paymentMode==='full'?grandTotal:Math.min(grandTotal,Math.max(0,Number(f.get('paid')||0)));
    const dueRaw=String(f.get('due')||'').trim();
    if(paymentMode==='advance'&&paid<=0)throw Error("Saisissez le montant de l'avance.");
    if(paymentMode==='advance'&&paid>=grandTotal)throw Error('Pour un paiement total, sélectionnez « Paiement total de la commande ».');
    if(paymentMode==='advance'&&!dueRaw)throw Error('Indiquez la date de règlement du solde fournisseur.');
    if(paid>0&&f.get('account')==='Espèces'&&!currentOpenCash(b))throw Error('Ouvrez la caisse de ce business avant un paiement fournisseur en espèces.');
    const newPurchases=b.purchases.slice(-lines.length),purchaseIds=newPurchases.map(x=>x.id);
    for(const p of newPurchases)p.paid=paid*(p.total/grandTotal||0);
    const debt=paymentMode==='full'?0:Math.max(0,grandTotal-paid);
    if(debt>0)b.supplierDebts.push({id:uid('sdeb'),supplierId:sup.id,purchaseIds,amount:debt,due:dueRaw,status:'open'});
    if(paid>0)addCashTx(b,{type:'out',amount:paid,category:'Achat fournisseur',party:sup.name,account:f.get('account'),note:f.get('note')||'Achat '+date});
    await persist();closeModal();renderContent();toast(paymentMode==='full'?`Achat enregistré ✓ • ${money(grandTotal)} payé intégralement • stock + TVA + caisse mis à jour.`:`Achat enregistré ✓ • avance ${money(paid)} • dette ${money(debt)} • échéance ${dueRaw}.`,'success');
  }catch(err){console.error('savePurchase',err);toast('Achat non enregistré : '+(err?.message||'erreur inattendue'),'error')}
}

</script></body></html>
